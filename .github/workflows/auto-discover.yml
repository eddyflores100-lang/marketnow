# MarketNow — Auto-Discovery (Weekly, queue mode)
# ================================================
# REVIVAL 2026-09-28 (P2-a2, mismo patrón de rot que el F-08): este workflow
# llevaba 1 run fallido (20-sep) y estado disabled_manually desde entonces.
# Causa raíz del fallo: el pipeline pre-split regeneraba skills.json (120MB) +
# skills_index.json (85MB) → el push moría en el pre-receive hook GH001
# (límite 100MB por archivo). Además referenciaba archivos eliminados en el
# split del 2026-09-26.
#
# MODO COLA (decisión de diseño post-audit):
#   El discovery NO importa automáticamente al catálogo. Los candidatos
#   descubiertos (awesome-mcp-servers + GitHub Search, pre-filtrados por
#   L1.7 anti-malware) van a _data/discovery_queue.json con status
#   'pending-review'. Razones:
#     a) La importación exige actualizar la constelación de conteos
#        (skills-lite, free-skills, stats-base.discovery, catalog-meta,
#        mcp.json, ai-plugin.json, landing) y regenerar certification.json —
#        si no, se recrea el drift F-02 (números anunciados ≠ realidad).
#     b) Auto-certificar repos no revisados en un catálogo "index-certified"
#        es una decisión de producto, no un default.
#   El flujo dev consume la cola con: auto-discover-mcp.mjs --import + sync
#   de la constelación + regeneración de certificación.
#
# massive-indexer.cjs fue retirado del pipeline: escribe skills_index.json
# (eliminado) — su aporte (GitHub Search multi-query) ya lo cubre el
# discoverFromGitHubSearch() del propio auto-discover-mcp.mjs.
#
# Triggers: Sunday 00:30 UTC + manual (max_new = límite de candidatos).

name: Auto-Discovery & Synthetic Replacement

on:
  schedule:
    - cron: '30 0 * * 0'  # Sunday 00:30 UTC
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Max new candidates this run (0 = no limit)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: auto-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run auto-discovery (queue mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW: ${{ github.event.inputs.max_new || '0' }}
        run: |
          ARGS=""
          if [ "$MAX_NEW" != "0" ] && [ -n "$MAX_NEW" ]; then
            ARGS="--max $MAX_NEW"
          fi
          node scripts/auto-discover-mcp.mjs $ARGS

      - name: Commit discovery queue (with retry on race)
        run: |
          git config user.name "MarketNow Discovery Bot"
          git config user.email "discovery@marketnow.site"

          if git diff --quiet HEAD -- _data/discovery_queue.json; then
            echo "No new candidates — nothing to commit."
            exit 0
          fi

          NEW=$(node -e "const q=require('./_data/discovery_queue.json'); console.log(q.entries.filter(e=>e.status==='pending-review').length)")

          git add _data/discovery_queue.json
          git commit -m "discovery: queue update — ${NEW} candidates pending review

          Weekly discovery run (awesome-mcp-servers + GitHub Search).
          Queue mode: candidates are NOT auto-imported into the catalog.
          Import requires the count-constellation sync + certification
          regen (see queue file note). L1.7 pre-filter applied."

          for i in 1 2 3 4 5; do
            if git push 2>&1; then
              echo "✓ Push succeeded on attempt $i"
              exit 0
            fi
            echo "⚠ Push attempt $i failed — pulling rebase and retrying..."
            sleep $((i * 2))
            git pull --rebase origin master || {
              echo "✗ git pull --rebase failed on attempt $i"
              git rebase --abort 2>/dev/null || true
              exit 1
            }
          done
          echo "✗ Could not push after 5 attempts"
          exit 1

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_id }}
          path: |
            _data/discovery_queue.json
          retention-days: 7
          if-no-files-found: ignore
