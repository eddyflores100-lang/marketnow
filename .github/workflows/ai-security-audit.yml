name: AliceLabs automated security audit (verification)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.py'
      - '**/package-lock.json'
      - '**/requirements*.txt'
      - '.github/workflows/**'
      - 'security-audit/**'
permissions:
  contents: read
jobs:
  internal-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: python -m pip install -r security-audit/requirements.txt
      - name: Run reproducible LangGraph audit
        run: python security-audit/audit.py --repo . --out audit-artifacts
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alicelabs-internal-security-audit
          path: |
            audit-artifacts/
            security-audit-results.json
          if-no-files-found: warn
          retention-days: 30
