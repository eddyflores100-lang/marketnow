name: AliceLabs security audit baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.py'
      - '**/package-lock.json'
      - '**/requirements*.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install 'semgrep>=1.100,<2'
      - name: Scan repository
        continue-on-error: true
        run: |
          semgrep scan --config p/owasp-top-ten --json --output semgrep-results.json . || true
          test -f semgrep-results.json || echo '{"errors":["scanner did not produce results"],"results":[]}' > semgrep-results.json
      - name: Archive machine-readable findings
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30
